[project]
authors = [{name = "C. D. Armstrong", email = "chris.armstrong@stfc.ac.uk"}]
dependencies = ["numpy>=2.3.5,<3", "scipy>=1.16.3,<2", "pandas>=2.3.3,<3", "matplotlib>=3.10.8,<4", "pytest>=9.0.2,<10", "jupyter>=1.1.1,<2"]
name = "MACR"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest"]
gui = ["pyside6"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
MACR = ["database/**/*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
macr = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pyside6 = ">=6.10.2,<7"
