[project]
name = "MACR"
version = "0.1.0"
description = "Material Attenuation Calculator for Radiation"
authors = [{name = "C. D. Armstrong", email = "chris.armstrong@stfc.ac.uk"}]
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "numpy>=2.3.5,<3", 
    "scipy>=1.16.3,<2", 
    "pandas>=2.3.3,<3", 
    "matplotlib>=3.10.8,<4", 
    "jupyter>=1.1.1,<2"
]

[project.optional-dependencies]
imaging = ["pillow"]
dev = ["pytest>=9.0.2,<10", "black", "ruff"]
all = ["macr[imaging,dev]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
MACR = ["database/**/*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
macr = { path = ".", editable = true }

[tool.pixi.tasks]
