[project]
authors = [{name = "C. D. Armstrong", email = "chris.armstrong@stfc.ac.uk"}]
dependencies = ["numpy>=2.3.5", "scipy>=1.16.3", "pandas>=2.3.3", "matplotlib>=3.10.8", "pytest>=9.0.2", "jupyter>=1.1.1"]
name = "MACR"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "pydata-sphinx-theme>=0.16.1",]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
MACR = ["database/**/*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.tasks]

[dependency-groups]
dev = [
    "pydata-sphinx-theme>=0.23.0",
    "pytest>=9.1.1",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
]
